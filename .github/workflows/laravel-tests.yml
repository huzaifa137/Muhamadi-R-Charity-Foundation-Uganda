name: Laravel tests

on:
  pull_request:
    branches: [main, feature/about-page-content-management]
  push:
    branches: [feature/community-operations-management]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, gd
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run feature and unit tests
        run: php artisan test
