name: Laravel tests

on:
  pull_request:
    branches: [main, feature/about-page-content-management, feature/community-operations-management, feature/operations-admin-ui, feature/dynamic-public-page-content, feature/admin-navigation-and-site-pages-ui]
  push:
    branches: [feature/community-operations-management, feature/operations-admin-ui, feature/dynamic-public-page-content, feature/admin-navigation-and-site-pages-ui]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version
          php -m | grep -E 'pdo_sqlite|sqlite3|gd|mbstring'
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run feature and unit tests
        run: php artisan test
